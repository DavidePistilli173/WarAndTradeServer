[package]
name = "WarAndTradeServer"
version = "0.1.0"
edition = "2024"
resolver = "3"

[dependencies]
axum = "0.8.1"
chrono = "0.4.31"
crossbeam-channel = "0.5.14"
glob = "0.3.2"
rwlog = { version = "0.1.0", path = "../rwlog" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["full"] }
